[project]
name = "youtube-bilingual"
version = "0.1.0"
description = "Download a YouTube video or read a local file, then mux bilingual original + Traditional Chinese subtitles into an MKV."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.68.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "webrtcvad-wheels>=2.0.10",
    "yt-dlp",
]

[project.scripts]
youtube-bilingual = "youtube_bilingual:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13"]
build-backend = "uv_build"
